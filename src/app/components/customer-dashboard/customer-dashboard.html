<div class="min-h-screen bg-slate-50">

  <!-- Navigation Bar -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm animate-slide-down">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-lg bg-blue-600 flex items-center justify-center shadow-sm">
            <svg class="h-4.5 w-4.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4zm6-3a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
          </div>
          <h1 class="text-lg font-bold text-slate-900 tracking-tight">Customer Manager</h1>
        </div>
        <div class="flex items-center space-x-4">
          <span class="text-slate-500 font-medium hidden sm:block text-sm">Hello, <span class="text-slate-900 font-semibold">{{ userName }}</span></span>
          <button (click)="logout()" class="text-sm bg-white border border-slate-300 text-slate-600 hover:bg-red-50 hover:text-red-600 hover:border-red-300 px-4 py-2 rounded-lg font-medium transition-all duration-200 active:scale-95">
            Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">

    <!-- Top Header & Search & Add Button -->
    <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4 animate-fade-in-up">
      <h2 class="text-2xl font-bold text-slate-900 whitespace-nowrap">Customer List</h2>

      <div class="flex-1 max-w-md w-full relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
          <svg class="h-4 w-4 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
          </svg>
        </div>
        <input type="text" (input)="onSearch($event)" placeholder="Search by ID, Name or Email..."
               class="block w-full pl-10 pr-3 py-2.5 bg-white border border-slate-300 rounded-lg leading-5 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 sm:text-sm transition-all duration-200">
      </div>

      <button (click)="openModal()" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 shadow-sm hover:shadow-md font-semibold transition-all duration-200 flex items-center gap-2 whitespace-nowrap active:scale-95">
        <span class="text-lg leading-none">+</span> Add Customer
      </button>
    </div>

    <!-- Data Table -->
    <div class="bg-white shadow-sm rounded-xl overflow-hidden border border-slate-200 animate-fade-in-up" style="animation-delay: 0.1s">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200">
          <thead class="bg-slate-50">
            <tr>
              <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">ID</th>
              <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Name & Email</th>
              <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Contact</th>
              <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
              <th class="px-6 py-3.5 text-right text-xs font-semibold text-slate-500 uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-slate-200">
            <tr *ngFor="let c of filteredCustomers; let i = index"
                class="hover:bg-slate-50 transition-colors duration-150 animate-row-in"
                [style.animation-delay]="(i * 0.04) + 's'">
              <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500 font-medium">#{{ c.id }}</td>
              <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-sm font-semibold text-slate-900">{{ c.name }}</div>
                <div class="text-sm text-slate-500">{{ c.email }}</div>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600 font-medium">{{ c.phone }}</td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span [ngClass]="{'bg-emerald-50 text-emerald-700 border-emerald-200': c.status === 'Active', 'bg-red-50 text-red-700 border-red-200': c.status === 'Inactive'}"
                      class="px-2.5 py-1 inline-flex text-xs leading-5 font-semibold rounded-full border">
                  {{ c.status }}
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-4">
                <button (click)="openModal(c)" class="text-blue-600 hover:text-blue-800 font-semibold transition-colors">Edit</button>
                <button (click)="deleteCustomer(c.id)" class="text-red-500 hover:text-red-700 font-semibold transition-colors">Delete</button>
              </td>
            </tr>

            <tr *ngIf="filteredCustomers.length === 0" class="animate-fade-in">
              <td colspan="5" class="px-6 py-12 text-center text-slate-500">
                <p class="text-lg font-medium text-slate-600">No customers found.</p>
                <p class="text-sm mt-1">Try adjusting your search or add a new customer.</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div *ngIf="showModal" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
      <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm animate-fade-in" (click)="closeModal()"></div>
      <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

      <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full animate-modal-in border border-slate-200">
        <form [formGroup]="customerForm" (ngSubmit)="saveCustomer()">
          <div class="px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
            <h3 class="text-lg leading-6 font-bold text-slate-900 mb-6 border-b border-slate-200 pb-3">
              {{ isEditing ? 'Edit Customer' : 'Add New Customer' }}
            </h3>
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Name</label>
                <input formControlName="name" type="text" class="block w-full bg-white border border-slate-300 rounded-lg shadow-sm py-2 px-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 sm:text-sm transition-all duration-200">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input formControlName="email" type="email" class="block w-full bg-white border border-slate-300 rounded-lg shadow-sm py-2 px-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 sm:text-sm transition-all duration-200">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Phone</label>
                <input formControlName="phone" type="text" class="block w-full bg-white border border-slate-300 rounded-lg shadow-sm py-2 px-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 sm:text-sm transition-all duration-200">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Address</label>
                <textarea formControlName="address" rows="2" class="block w-full bg-white border border-slate-300 rounded-lg shadow-sm py-2 px-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 sm:text-sm resize-none transition-all duration-200"></textarea>
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
                <select formControlName="status" class="block w-full bg-white border border-slate-300 rounded-lg shadow-sm py-2 px-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 sm:text-sm transition-all duration-200">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
            </div>
          </div>
          <div class="bg-slate-50 border-t border-slate-200 px-4 py-4 sm:px-6 flex flex-row-reverse gap-3">
            <button type="submit" [disabled]="customerForm.invalid" class="w-full inline-flex justify-center rounded-lg border border-transparent shadow-sm px-5 py-2 bg-blue-600 text-sm font-semibold text-white hover:bg-blue-700 focus:outline-none sm:w-auto disabled:bg-slate-300 disabled:cursor-not-allowed transition-all duration-200 active:scale-95">
              Save
            </button>
            <button type="button" (click)="closeModal()" class="w-full inline-flex justify-center rounded-lg border border-slate-300 shadow-sm px-5 py-2 bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none sm:w-auto transition-all duration-200 active:scale-95">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
