<div class="min-h-screen flex bg-slate-50 font-sans">
  <!-- Left Panel - Deep Branding -->
  <div class="hidden lg:flex flex-col justify-between w-1/2 bg-slate-900 relative overflow-hidden p-16">
    <!-- Abstract Gradient Background -->
    <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-slate-900 to-indigo-950 opacity-90"></div>
    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmZmZmYiIGZpbGwtb3BhY2l0eT0iMC4wNSIvPjwvc3ZnPg==')]"></div>
    
    <!-- Top glowing orb -->
    <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 rounded-full bg-indigo-600 blur-3xl opacity-20"></div>

    <div class="flex items-center gap-3 relative z-10">
      <div class="h-12 w-12 rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4zm6-3a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
      </div>
      <span class="text-white font-bold text-2xl tracking-tight">Customer<span class="text-indigo-400">Hub</span></span>
    </div>

    <div class="space-y-6 max-w-lg relative z-10">
      <h1 class="text-5xl font-extrabold text-white leading-tight tracking-tight">
        Welcome back to your workspace.
      </h1>
      <p class="text-indigo-200 text-lg leading-relaxed">Sign in to access your customer dashboard, manage accounts, and grow your business.</p>
    </div>

    <div class="relative z-10 flex items-center justify-between border-t border-white/10 pt-6">
      <p class="text-slate-400 text-sm font-medium">© 2026 CustomerHub Inc.</p>
      <div class="flex gap-4">
        <a href="#" class="text-slate-400 hover:text-white transition-colors text-sm font-medium">Help</a>
        <a href="#" class="text-slate-400 hover:text-white transition-colors text-sm font-medium">Privacy</a>
      </div>
    </div>
  </div>

  <!-- Right Panel - Clean Form -->
  <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 bg-white">
    <div class="w-full max-w-md">
      
      <div class="lg:hidden mx-auto h-12 w-12 rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-600 flex items-center justify-center shadow-lg mb-8">
        <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4zm6-3a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
      </div>

      <h2 class="text-3xl font-extrabold text-slate-900 mb-2 tracking-tight">Sign in</h2>
      <p class="text-slate-500 text-base mb-10 font-medium">Please enter your credentials to proceed.</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Email Address</label>
          <input formControlName="email" type="email"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200"
            placeholder="name@company.com">
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-sm font-bold text-slate-700">Password</label>
            <a href="#" class="text-sm font-semibold text-indigo-600 hover:text-indigo-500 transition-colors">Forgot password?</a>
          </div>
          <input formControlName="password" type="password"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200"
            placeholder="••••••••">
        </div>

        <div *ngIf="errorMessage" class="flex items-center gap-2 text-rose-700 text-sm font-bold bg-rose-50 border border-rose-200 px-4 py-3 rounded-xl">
          <svg class="w-5 h-5 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          {{ errorMessage }}
        </div>

        <button type="submit" [disabled]="loginForm.invalid"
          class="w-full py-3 px-4 rounded-xl text-base font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-lg shadow-indigo-600/30 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-slate-300 disabled:shadow-none disabled:cursor-not-allowed transition-all duration-200 active:scale-[0.98]">
          Sign in
        </button>

        <p class="text-sm text-center text-slate-500 pt-4 font-medium">
          Don't have an account? 
          <a routerLink="/register" class="font-bold text-indigo-600 hover:text-indigo-700 transition-colors">Create one now</a>
        </p>
      </form>
    </div>
  </div>
</div>
