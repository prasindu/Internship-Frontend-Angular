<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border border-gray-100">
    <div>
      <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900">Create an Account</h2>
      <p class="mt-2 text-center text-sm text-gray-600">Enter your details to register</p>
    </div>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
      <div class="space-y-4">
        
        <!-- Name Field -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
          <input formControlName="name" type="text" class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors" placeholder="John Doe">
          <div *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid" class="text-red-500 text-xs mt-1">
            Name is required.
          </div>
        </div>

        <!-- Email Field -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
          <input formControlName="email" type="email" class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors" placeholder="user@example.com">
          <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="text-red-500 text-xs mt-1">
            Valid email is required.
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input formControlName="password" type="password" class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors" placeholder="••••••••">
          <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['required']" class="text-red-500 text-xs mt-1">
            Password is required.
          </div>
          <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['minlength']" class="text-red-500 text-xs mt-1">
            Password must be at least 6 characters.
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div *ngIf="errorMessage" class="text-red-500 text-sm text-center font-medium bg-red-50 p-2 rounded-lg">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="text-green-600 text-sm text-center font-medium bg-green-50 p-2 rounded-lg">
        {{ successMessage }}
      </div>

      <!-- Submit Button -->
      <div>
        <button type="submit" [disabled]="registerForm.invalid" class="w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-blue-300 transition-colors shadow-sm">
          Register
        </button>
      </div>
      
      <!-- Go to Login -->
      <div class="text-sm text-center mt-4">
        <a routerLink="/login" class="font-medium text-blue-600 hover:text-blue-500 transition-colors">
          Already have an account? Sign in
        </a>
      </div>
    </form>
  </div>
</div>
